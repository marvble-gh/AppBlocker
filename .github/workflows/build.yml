name: Build exe app with icon

on:
  release:
    types: [published] 

jobs:
  build-windows:
    runs-on: windows-latest 

    steps:
    - name: Download code form repo
      uses: actions/checkout@v4

    - name: Configure python enviroment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10' 

    - name: Install libraries and pyInstaller
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
       

    - name: Compile code to EXE with icon
      run: |
        pyinstaller --onefile --windowed --icon=MainIcon.ico moj_program.py

    - name: (Release)
      uses: softprops/action-gh-release@v2
      with:
        files: dist/AppBlocker.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
