name: Build exe app with icon

on:
  release:
    types: [published] 

jobs:
  build-windows:
    runs-on: windows-latest 

    steps:
    - name: Download code form repo
      uses: actions/checkout@v4

    - name: Configure python enviroment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10' 

    - name: Install libraries and pyInstaller
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install psutil pillow pystray

    - name: Compile AppBlocker to EXE with icon
      run: |
        pyinstaller --onefile --windowed --icon=MainIcon.ico AppBlocker.py

    - name: Compile AppBlockerWatchdog to EXE with icon
      run: |
        pyinstaller --onefile --windowed --icon=MainIcon.ico AppBlockerWatchdog.py

    - name: Copy required image files next to the exe
      run: |
        copy appBlockerIconImage.png dist\
        copy appBlockerKeyImage.png dist\

    - name: (Release)
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dist/AppBlocker.exe
          dist/AppBlockerWatchdog.exe
          dist/appBlockerIconImage.png
          dist/appBlockerKeyImage.png
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
